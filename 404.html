<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>GlobalBQS Forms</title>
<script>
// Static hosts serve this page for unknown paths (e.g. /j/<token> or /demo/j/<token>).
// Send the browser to the app with the token in the hash: <base>/#/j/<token>.
(function(){
  var p = location.pathname, m = /^(.*\/)j\/([0-9a-fA-F]{64})\/?$/.exec(p);
  if (m) { location.replace(m[1] + '#/j/' + m[2].toLowerCase()); return; }
  var d = /^(.*\/demo\/)/.exec(p);
  location.replace(d ? d[1] : '/');
})();
</script></head><body style="font-family:sans-serif;padding:24px">Opening GlobalBQS Forms… <a href="./">Continue</a></body></html>
