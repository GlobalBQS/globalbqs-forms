<script>
// Fallback for hosts without a 404 rewrite: links of the form /j/?<token>, /j/?t=<token> or /j/#<token>.
(function(){
  var s = location.search + ' ' + location.hash + ' ' + location.pathname, m = /([0-9a-fA-F]{64})/.exec(s);
  var base = location.pathname.replace(/j\/.*$/, '');
  location.replace(base + (m ? '#/j/' + m[1].toLowerCase() : ''));
})();
